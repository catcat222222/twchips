[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "twchips"
version = "0.1.0"
description = "台灣市場籌碼資料小工具：期交所日行情與三大法人，直接回 pandas DataFrame（證交所在路上）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "catcat222222" }]
dependencies = ["requests>=2.20", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/catcat222222/twchips"

[tool.setuptools]
packages = ["twchips"]
